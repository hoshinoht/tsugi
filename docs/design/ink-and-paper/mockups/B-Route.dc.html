<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink and Paper Route</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..800&amp;family=Zen+Old+Mincho:wght@600;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8402B}a:hover{color:#9E2F1F}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F1E7; color: #1E2433; font-family: 'Google Sans Flex', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 4px 8px;">
    <a href="B-Stop.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; color: #1E2433; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 12px; letter-spacing: 2px; color: #5B6170;">EVERY 8–12 MIN</span>
  </header>

  <section aria-label="Service 32" style="display: flex; align-items: center; gap: 14px; padding: 4px 20px 16px 20px;">
    <span style="position: relative; width: 64px; height: 64px; flex-shrink: 0;">
      <svg width="64" height="64" viewBox="0 0 116 116" aria-hidden="true" style="position: absolute; inset: 0;"><path d="{{cookie}}" fill="#2F3E6E"></path></svg>
      <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFFDF8; font-size: 24px; font-weight: 800;">32</span>
    </span>
    <span style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 12px; letter-spacing: 2px; color: #5B6170;">TOWARDS</span>
      <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 30px; line-height: 34px;">Bedok Int</span>
    </span>
  </section>

  <main style="flex: 1; position: relative; margin: 0 16px; border-radius: 26px; background: #FFFDF8; border: 1px solid #E2DACB; padding: 18px 16px 18px 0; overflow: hidden;">
    <svg aria-hidden="true" width="40" height="560" viewBox="0 0 40 560" style="position: absolute; left: 22px; top: 26px;">
      <defs>
        <filter id="brush" x="-60%" y="-2%" width="220%" height="104%">
          <feTurbulence type="fractalNoise" baseFrequency="0.8 0.035" numOctaves="2" seed="7" result="grain"></feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="grain" scale="3.5" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
        </filter>
      </defs>
      <g filter="url(#brush)">
        <path d="M16 70 C15.5 200, 16.5 380, 16 560 L22 560 C21.5 380, 22.5 200, 22 70 Z" fill="#CFC7B6" opacity="0.75"></path>
        <path d="M17.5 120 V550" stroke="#F6F1E7" stroke-width="0.9" stroke-dasharray="40 14 90 8 60 22" opacity="0.8"></path>
        <path d="M13.5 0 L24.5 0 C24 30, 23 60, 22 80 Q19 96, 16 80 C15 60, 14 30, 13.5 0 Z" fill="#1E2433"></path>
        <path d="M16.5 4 V78" stroke="#FFFDF8" stroke-width="0.8" stroke-dasharray="22 5 14 9" opacity="0.55"></path>
        <path d="M21 10 V70" stroke="#FFFDF8" stroke-width="0.7" stroke-dasharray="8 6 30 4" opacity="0.45"></path>
      </g>
    </svg>

    <div style="position: relative; display: flex; flex-direction: column;">
      <sc-for list="{{stops}}" as="s" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 14px; min-height: 62px; padding-left: 28px; opacity: {{s.op}};">
          <span style="width: 26px; display: flex; justify-content: center; flex-shrink: 0;">
            <span style="width: {{s.dot}}px; height: {{s.dot}}px; border-radius: 50%; background: {{s.fill}}; border: 3px solid {{s.ring}}; box-sizing: border-box;"></span>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
            <span style="font-family: {{s.font}}; font-weight: {{s.weight}}; font-size: {{s.size}}px;">{{s.name}}</span>
            <span style="font-size: 12px; color: #5B6170;">{{s.meta}}</span>
          </span>
          <sc-if value="{{s.bus}}" hint-placeholder-val="{{false}}">
            <span style="display: flex; align-items: center; gap: 8px;">
              <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 22px;">3<span style="font-family: 'Google Sans Flex', sans-serif; font-size: 12px; color: #5B6170;"> min</span></span>
              <span style="width: 38px; height: 38px; border-radius: 19px; background: #2F3E6E; display: flex; align-items: center; justify-content: center;" aria-label="Bus here"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFDF8" aria-hidden="true"><path d="M6 3h12a2 2 0 0 1 2 2v11a2 2 0 0 1-1 1.7V20a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H8v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-2.3A2 2 0 0 1 4 16V5a2 2 0 0 1 2-2zm0 3v5h12V6zm1.5 7.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"></path></svg></span>
            </span>
          </sc-if>
          <sc-if value="{{s.you}}" hint-placeholder-val="{{false}}">
            <span style="height: 28px; padding: 0 10px; border-radius: 14px; border: 1.5px solid {{vermilion}}; color: {{vermilion}}; display: inline-flex; align-items: center; font-size: 12px; font-weight: 700;">You board here</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>

  <div style="padding: 14px 16px 24px 16px; display: flex; gap: 10px;">
    <button style="flex: 1; height: 52px; border: 0; border-radius: 26px; background: #1E2433; color: #F6F1E7; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"></path></svg>
      Tell me when it's near
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vermilion":{"editor":"color","default":"#C8402B","options":["#C8402B","#2F3E6E","#3C7A5A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    let d = '';
    for (let i = 0; i <= 180; i++) {
      const a = (i / 180) * Math.PI * 2 - Math.PI / 2;
      const r = 52 + 4 * Math.cos(9 * a);
      d += (i ? 'L' : 'M') + (58 + r * Math.cos(a)).toFixed(2) + ' ' + (58 + r * Math.sin(a)).toFixed(2);
    }
    const vermilion = this.props.vermilion ?? '#C8402B';
    const mincho = "'Zen Old Mincho', serif";
    const sans = "'Google Sans Flex', sans-serif";
    const stop = (name, meta, kind) => ({
      name, meta,
      op: kind === 'passed' ? 0.4 : 1,
      bus: kind === 'bus', you: kind === 'you',
      dot: kind === 'you' ? 22 : 16,
      fill: kind === 'you' ? vermilion : kind === 'passed' || kind === 'bus' ? '#1E2433' : '#FFFDF8',
      ring: kind === 'you' ? vermilion : '#1E2433',
      font: kind === 'you' ? mincho : sans,
      weight: kind === 'you' ? 900 : 600,
      size: kind === 'you' ? 19 : 15
    });
    return {
      vermilion,
      cookie: d + 'Z',
      stops: [
        stop('Bras Basah Cplx', '01012', 'passed'),
        stop('Opp Bugis Junction', '01121 · bus is here', 'bus'),
        stop('Fortune Centre', '01139 · 1 stop to go', ''),
        stop('Bugis Stn Exit A', '01113 · Victoria St', 'you'),
        stop('Aft Jln Sultan', '01219', ''),
        stop('Opp Lavender Stn', '01311', ''),
        stop('Kallang Bahru', '01411 · 8 more to Bedok Int', '')
      ]
    };
  }
}
</script>
</body>
</html>
