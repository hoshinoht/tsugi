<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink and Paper brand sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..800&amp;family=Zen+Old+Mincho:wght@600;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8402B}a:hover{color:#9E2F1F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F1E7; color: #1E2433; font-family: 'Google Sans Flex', system-ui, sans-serif; padding: 36px 24px; display: flex; flex-direction: column; gap: 28px;">

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #5B6170;">Wordmark</span>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: 'Zen Old Mincho', serif; font-size: 54px; line-height: 54px; font-weight: 900; letter-spacing: -1px;">Tsugi</span>
      <svg width="132" height="10" viewBox="0 0 132 10" aria-hidden="true"><path d="M3 6 C 30 2, 70 9, 129 4" fill="none" stroke="{{vermilion}}" stroke-width="5" stroke-linecap="round"></path></svg>
    </div>
    <span style="font-size: 14px; color: #5B6170;">The next bus, quietly.</span>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #5B6170;">Palette</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{swatches}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="height: 64px; border-radius: 14px; background: {{s.hex}}; outline: 1px solid #E2DACB;"></div>
          <span style="font-size: 12px; font-weight: 650;">{{s.name}}</span>
          <span style="font-size: 11px; color: #5B6170;">{{s.hex}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #5B6170;">Numerals and arriving</span>
    <div style="display: flex; align-items: center; gap: 18px;">
      <div style="display: flex; align-items: baseline; gap: 4px;">
        <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 64px; line-height: 64px;">3</span>
        <span style="font-size: 16px; font-weight: 600; color: #5B6170;">min</span>
      </div>
      <span style="flex: 1;"></span>
      <span style="display: inline-flex; align-items: center; gap: 6px; color: {{vermilion}};" aria-label="Arriving now"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{vermilion}};"></span><span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 40px;">Now</span></span>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #5B6170;">Icon and shape</span>
    <div style="display: flex; align-items: center; gap: 20px;">
      <svg width="96" height="96" viewBox="0 0 116 116" role="img" aria-label="Tsugi icon: a bus front on a cookie shape">
        <path d="{{cookie}}" fill="#2F3E6E"></path>
        <g fill="#FFFDF8" fill-rule="evenodd" transform="translate(58 58) scale(0.62) translate(-54 -55.5)"><path d="M45 30h18a9 9 0 0 1 9 9v26a9 9 0 0 1-9 9H45a9 9 0 0 1-9-9V39a9 9 0 0 1 9-9zM43 38h22a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H43a3 3 0 0 1-3-3V41a3 3 0 0 1 3-3zM41 63a3 3 0 1 0 6 0a3 3 0 1 0-6 0zM61 63a3 3 0 1 0 6 0a3 3 0 1 0-6 0z"></path><path d="M40 74h7v7h-7zM61 74h7v7h-7z"></path></g>
      </svg>
      <span style="font-size: 14px; line-height: 20px; color: #5B6170; flex: 1;">Indigo cookie for the icon and badges. Vermilion is kept for one thing: a bus that is arriving now.</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vermilion":{"editor":"color","default":"#C8402B","options":["#C8402B","#2F3E6E","#3C7A5A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    let d = '';
    for (let i = 0; i <= 180; i++) {
      const a = (i / 180) * Math.PI * 2 - Math.PI / 2;
      const r = 52 + 4 * Math.cos(9 * a);
      d += (i ? 'L' : 'M') + (58 + r * Math.cos(a)).toFixed(2) + ' ' + (58 + r * Math.sin(a)).toFixed(2);
    }
    const vermilion = this.props.vermilion ?? '#C8402B';
    return {
      vermilion,
      cookie: d + 'Z',
      swatches: [
        { name: 'Washi', hex: '#F6F1E7' },
        { name: 'Sumi', hex: '#1E2433' },
        { name: 'Indigo', hex: '#2F3E6E' },
        { name: 'Vermilion', hex: vermilion }
      ]
    };
  }
}
</script>
</body>
</html>
