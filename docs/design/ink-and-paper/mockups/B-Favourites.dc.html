<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink and Paper Favourites</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..800&amp;family=Zen+Old+Mincho:wght@600;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8402B}a:hover{color:#9E2F1F}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F1E7; color: #1E2433; font-family: 'Google Sans Flex', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 26px 16px 10px 20px;">
    <span style="font-family: 'Zen Old Mincho', serif; font-size: 32px; font-weight: 900;">Favourites</span>
    <button aria-label="Settings" style="width: 44px; height: 44px; border: 1px solid #E2DACB; border-radius: 22px; background: #FFFDF8; color: #5B6170; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"></path><circle cx="16" cy="7" r="2.5"></circle><circle cx="10" cy="17" r="2.5"></circle></svg>
    </button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 16px 120px 16px;">
    <section aria-label="Next bus" style="position: relative; border-radius: 26px; background: #FFFDF8; border: 1px solid #E2DACB; padding: 18px 18px 16px 18px; display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 12px; letter-spacing: 2px; color: #5B6170;">NEXT · 110 M AWAY</span>
      <div style="display: flex; align-items: center; gap: 16px;">
        <span style="position: relative; width: 72px; height: 72px; flex-shrink: 0;">
          <svg width="72" height="72" viewBox="0 0 116 116" aria-hidden="true" style="position: absolute; inset: 0;"><path d="{{cookie}}" fill="#2F3E6E"></path></svg>
          <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFFDF8; font-size: 26px; font-weight: 800;">61</span>
        </span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 20px; font-weight: 700;">Eunos Int</span>
          <span style="font-size: 13px; color: #5B6170;">Bugis Stn Exit A · 2 stops away</span>
        </div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 6px; border-top: 1px solid #EEE7DA; padding-top: 10px;">
        <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 56px; line-height: 56px;">3</span>
        <span style="font-size: 16px; font-weight: 600; color: #5B6170;">min</span>
        <span style="flex: 1;"></span>
        <span style="font-size: 14px; color: #5B6170;">then 11 · 24 min</span>
      </div>
    </section>

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 6px; font-size: 13px; color: #5B6170;">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #3C7A5A;"></span>Trains running normally
    </div>

    <section aria-label="Bugis Stn Exit A" style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 18px; padding: 0 6px;">Bugis Stn Exit A</span>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 14px 8px 10px; border-radius: 20px; background: #FFFDF8; border: 1px solid #E2DACB;">
          <span style="min-width: 48px; height: 40px; border-radius: 14px; background: #E7EAF3; color: #2F3E6E; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800;">{{r.svc}}</span>
          <span style="flex: 1; font-size: 15px; font-weight: 600;">{{r.dest}}</span>
          <sc-if value="{{r.arr}}" hint-placeholder-val="{{false}}">
            <span style="display: inline-flex; align-items: center; gap: 6px; color: {{vermilion}};" aria-label="Arriving now"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{vermilion}};"></span><span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 24px;">Now</span></span>
          </sc-if>
          <sc-if value="{{r.notArr}}" hint-placeholder-val="{{true}}">
            <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 26px;">{{r.mins}}<span style="font-family: 'Google Sans Flex', sans-serif; font-size: 12px; font-weight: 600; color: #5B6170;"> min</span></span>
          </sc-if>
        </div>
      </sc-for>
    </section>
  </main>

  <nav aria-label="Primary" style="position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center;">
    <div style="display: flex; padding: 6px; border-radius: 30px; background: #1E2433; box-shadow: 0 8px 24px rgba(30,36,51,0.25);">
      <a href="B-Favourites.dc.html" aria-current="page" style="width: 104px; height: 46px; border-radius: 23px; background: #F6F1E7; color: #1E2433; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; font-size: 14px;">Saved</a>
      <a href="B-Nearby.dc.html" style="width: 104px; height: 46px; border-radius: 23px; color: #C9CDD8; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 14px;">Nearby</a>
      <a href="B-Stop.dc.html" style="width: 104px; height: 46px; border-radius: 23px; color: #C9CDD8; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 14px;">Search</a>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vermilion":{"editor":"color","default":"#C8402B","options":["#C8402B","#2F3E6E","#3C7A5A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    let d = '';
    for (let i = 0; i <= 180; i++) {
      const a = (i / 180) * Math.PI * 2 - Math.PI / 2;
      const r = 52 + 4 * Math.cos(9 * a);
      d += (i ? 'L' : 'M') + (58 + r * Math.cos(a)).toFixed(2) + ' ' + (58 + r * Math.sin(a)).toFixed(2);
    }
    const row = (svc, dest, mins) => ({ svc, dest, mins, arr: mins === 0, notArr: mins !== 0 });
    return {
      vermilion: this.props.vermilion ?? '#C8402B',
      cookie: d + 'Z',
      rows: [row('32', 'Bedok Int', 0), row('33', 'Bedok Int', 4), row('2', 'Changi Village Ter', 8)]
    };
  }
}
</script>
</body>
</html>
