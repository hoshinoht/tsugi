<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink and Paper Nearby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..800&amp;family=Zen+Old+Mincho:wght@600;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8402B}a:hover{color:#9E2F1F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F1E7; color: #1E2433; font-family: 'Google Sans Flex', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="padding: 26px 20px 12px 20px; display: flex; flex-direction: column; gap: 2px;">
    <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 32px;">Nearby</span>
    <span style="font-size: 13px; color: #5B6170;">Near Bugis · 4 stops within 200 m</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 16px 120px 16px;">
    <section aria-label="Bugis Stn Exit A" style="border-radius: 26px; background: #FFFDF8; border: 1px solid #E2DACB; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: flex-start; gap: 12px;">
        <span style="flex: 1; display: flex; flex-direction: column;">
          <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 20px;">Bugis Stn Exit A</span>
          <span style="font-size: 12px; color: #5B6170;">01113 · Victoria St</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end;">
          <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 22px; line-height: 24px;">21 m</span>
          <span style="font-size: 11px; color: #5B6170;">1 min walk</span>
        </span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
          <a href="B-Stop.dc.html" style="text-decoration: none; color: #1E2433; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 14px; background: {{t.bg}};">
            <span style="font-size: 15px; font-weight: 800; color: {{t.fg}};">{{t.svc}}</span>
            <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 18px; color: {{t.fg}};">{{t.when}}</span>
          </a>
        </sc-for>
      </div>
    </section>

    <sc-for list="{{stops}}" as="s" hint-placeholder-count="3">
      <a href="B-Stop.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 20px; background: #FFFDF8; border: 1px solid #E2DACB; color: #1E2433; text-decoration: none;">
        <span style="flex: 1; display: flex; flex-direction: column;">
          <span style="font-size: 16px; font-weight: 700;">{{s.name}}</span>
          <span style="font-size: 12px; color: #5B6170;">{{s.code}} · {{s.road}}</span>
        </span>
        <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 18px;">{{s.dist}}</span>
      </a>
    </sc-for>
  </main>

  <nav aria-label="Primary" style="position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center;">
    <div style="display: flex; padding: 6px; border-radius: 30px; background: #1E2433; box-shadow: 0 8px 24px rgba(30,36,51,0.25);">
      <a href="B-Favourites.dc.html" style="width: 104px; height: 46px; border-radius: 23px; color: #C9CDD8; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 14px;">Saved</a>
      <a href="B-Nearby.dc.html" aria-current="page" style="width: 104px; height: 46px; border-radius: 23px; background: #F6F1E7; color: #1E2433; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; font-size: 14px;">Nearby</a>
      <a href="B-Stop.dc.html" style="width: 104px; height: 46px; border-radius: 23px; color: #C9CDD8; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 14px;">Search</a>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vermilion":{"editor":"color","default":"#C8402B","options":["#C8402B","#2F3E6E","#3C7A5A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const vermilion = this.props.vermilion ?? '#C8402B';
    const t = (svc, when) => ({
      svc, when,
      bg: when === 'Now' ? '#FBE9E5' : '#F6F1E7',
      fg: when === 'Now' ? vermilion : '#1E2433'
    });
    return {
      tiles: [t('61', 'Now'), t('32', '3 min'), t('33', '4 min'), t('2', '8 min'), t('145', '12 min'), t('130', '16 min')],
      stops: [
        { name: 'Bugis Stn Exit B', code: '01059', road: 'Victoria St', dist: '96 m' },
        { name: 'Bugis Cube', code: '01039', road: 'Nth Bridge Rd', dist: '142 m' },
        { name: 'Aft Bugis Stn Exit C', code: '01119', road: 'Victoria St', dist: '188 m' }
      ]
    };
  }
}
</script>
</body>
</html>
