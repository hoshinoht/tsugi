<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink and Paper Stop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..800&amp;family=Zen+Old+Mincho:wght@600;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8402B}a:hover{color:#9E2F1F}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F1E7; color: #1E2433; font-family: 'Google Sans Flex', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 4px 8px;">
    <a href="B-Favourites.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; color: #1E2433; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <button aria-label="Saved stop" aria-pressed="true" style="width: 44px; height: 44px; border: 1px solid #E2DACB; border-radius: 22px; background: #FFFDF8; color: {{vermilion}}; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg>
    </button>
  </header>

  <section aria-label="Stop" style="padding: 4px 20px 14px 20px; display: flex; flex-direction: column; gap: 4px;">
    <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 34px; line-height: 40px;">Bugis Stn Exit A</span>
    <span style="width: 48px; height: 3px; border-radius: 2px; background: {{vermilion}};"></span>
    <span style="font-size: 13px; color: #5B6170; padding-top: 4px;">Victoria St · 01113 · Bugis MRT 21 m · across the road: Exit B</span>
  </section>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 0 16px 24px 16px;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <article style="border-radius: 22px; background: #FFFDF8; border: 1px solid #E2DACB; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="min-width: 48px; height: 40px; border-radius: 14px; background: #2F3E6E; color: #FFFDF8; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800;">{{r.svc}}</span>
          <span style="flex: 1; display: flex; flex-direction: column;">
            <span style="font-size: 15px; font-weight: 600;">{{r.dest}}</span>
            <span style="font-size: 12px; color: #5B6170;">{{r.meta}}</span>
          </span>
          <sc-if value="{{r.arr}}" hint-placeholder-val="{{false}}">
            <span style="display: inline-flex; align-items: center; gap: 6px; color: {{vermilion}};" aria-label="Arriving now"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{vermilion}};"></span><span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 22px;">Now</span></span>
          </sc-if>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
          <sc-for list="{{r.times}}" as="t" hint-placeholder-count="3">
            <span style="display: flex; align-items: baseline; gap: 3px; padding: 6px 10px; border-radius: 12px; background: #F6F1E7;">
              <span style="font-family: 'Zen Old Mincho', serif; font-weight: 900; font-size: 24px; color: {{t.color}};">{{t.v}}</span>
              <span style="font-size: 11px; font-weight: 600; color: #5B6170;">{{t.unit}}</span>
            </span>
          </sc-for>
        </div>
      </article>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vermilion":{"editor":"color","default":"#C8402B","options":["#C8402B","#2F3E6E","#3C7A5A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const vermilion = this.props.vermilion ?? '#C8402B';
    const tile = (v) => (v === '0' ? { v: 'Now', unit: '', color: vermilion } : { v, unit: 'min', color: '#1E2433' });
    const row = (svc, dest, meta, times) => ({ svc, dest, meta, times: times.map(tile), arr: times[0] === '0' });
    return {
      vermilion,
      rows: [
        row('61', 'Eunos Int', 'Almost here · standing', ['0', '11', '24']),
        row('32', 'Bedok Int', '2 stops away · seats', ['3', '15', '31']),
        row('33', 'Bedok Int', '3 stops away · seats', ['4', '14', '26']),
        row('2', 'Changi Village Ter', 'Limited standing', ['8', '19', '33']),
        row('145', 'Bedok Int', 'Seats · every 12–15 min', ['12', '27', '41'])
      ]
    };
  }
}
</script>
</body>
</html>
